<!-- Header component with scroll behavior -->
<header class="bg-indigo-900 text-indigo-100 shadow-lg z-20 transition-all duration-300 fixed top-0 left-64 right-0" [ngClass]="{'opacity-0 -translate-y-full': isScrolled}">
    <div class="px-6 py-4 flex items-center justify-between">
      <div class="flex items-center">
        <h2 class="text-xl font-semibold text-gray-800">Dashboard</h2>
      </div>
      <div class="flex items-center">
        <button title="a" class="p-1.5 text-gray-500 focus:outline-none hover:text-gray-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
      </div>
    </div>
  </header>
