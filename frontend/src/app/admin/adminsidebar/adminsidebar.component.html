<div class="w-64 h-full bg-indigo-900 text-indigo-300 shadow-xl">
    <div class="flex flex-col h-full">
      <div class="flex items-center p-5 border-b border-indigo-800">
        <svg class="w-8 h-8 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M11 17a1 1 0 001.447.894l4-2A1 1 0 0017 15V9.236a1 1 0 00-1.447-.894l-4 2a1 1 0 00-.553.894V17zM15.211 6.276a1 1 0 000-1.788l-4.764-2.382a1 1 0 00-.894 0L4.789 4.488a1 1 0 000 1.788l4.764 2.382a1 1 0 00.894 0l4.764-2.382zM4.447 8.342A1 1 0 003 9.236V15a1 1 0 00.553.894l4 2A1 1 0 009 17v-5.764a1 1 0 00-.553-.894l-4-2z" />
        </svg>
        <span class="ml-3 text-lg font-medium">Dashboard</span>
      </div>
      <div class="flex-grow overflow-y-auto px-4 py-4">
        <div class="mb-6">
          <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-3 pl-2">Main</p>
          <a [routerLink]="['/admin/movement']" routerLinkActive="bg-indigo-700 text-indigo-100" class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
            <span class="ml-3 text-sm font-medium">Movements</span>
          </a>
          <a [routerLink]="['']"  class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <span class="ml-3 text-sm font-medium">Check HomePage</span>
          </a>
          <a [routerLink]="['/admin/userSuggestions']"  class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span class="ml-3 text-sm font-medium">Suggestions</span>
          </a>
          <a [routerLink]="['/admin/reports']" routerLinkActive="bg-indigo-700 text-indigo-100" class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
            </svg>
            <span class="ml-3 text-sm font-medium">Reports</span>
          </a>
        </div>

        <!-- Admin section -->
        <div class="mb-6">
          <p class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-3 pl-2">Management</p>
          <a [routerLink]="['/admin/healthcareprof']" routerLinkActive="bg-indigo-700 text-indigo-100" class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            <span class="ml-3 text-sm font-medium">Healthcare Prof.</span>
          </a>
          <a [routerLink]="['/admin/users']" *ngIf="isSuperAdmin()" routerLinkActive="bg-indigo-700 text-indigo-100" class="flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <span class="ml-3 text-sm font-medium">Users</span>
          </a>
          <a [routerLink]="['/admin/frauds']" routerLinkActive="bg-indigo-700 text-indigo-100" class="relative flex items-center h-10 px-3 my-1 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
            <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
            </svg>
            <span class="ml-3 text-sm font-medium">Fraud</span>
            <span class="absolute top-0 left-0 w-2 h-2 mt-2 ml-2 bg-indigo-400 rounded-full animate-pulse"></span>
          </a>
        </div>
      </div>

      <!-- Account section at bottom -->
      <div class="border-t border-indigo-800 p-4">
        <a [routerLink]="['/admin/account']" routerLinkActive="bg-indigo-700 text-indigo-100" class="flex items-center px-3 h-10 rounded-lg hover:bg-indigo-800 hover:text-indigo-100 transition duration-200">
          <svg class="w-5 h-5 stroke-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="ml-3 text-sm font-medium">Account</span>
        </a>
      </div>
    </div>
  </div>
