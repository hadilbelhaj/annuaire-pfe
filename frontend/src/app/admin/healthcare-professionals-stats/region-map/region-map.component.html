<div *ngIf="data && data.length > 0" style="position: relative; height: 300px;">
    <canvas baseChart
      [type]="barChartType"
      [data]="barChartData"
      [options]="barChartOptions">
    </canvas>
  </div>
  
  <div *ngIf="!data || data.length === 0" class="flex justify-center items-center h-64">
    <p class="text-gray-500">Aucune donnée disponible</p>
  </div>
