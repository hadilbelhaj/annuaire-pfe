<!-- reports-dashboard.component.html -->
<div class="container mx-auto p-6 max-w-5xl">
    <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
      <!-- Header with elegant gradient -->
      <div class="bg-gradient-to-r from-indigo-600 to-purple-600 px-8 py-6">
        <h1 class="text-white text-3xl font-bold flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          Generate Reports
        </h1>
        <p class="text-indigo-100 mt-2 font-light">Healthcare analytics at your fingertips</p>
      </div>
  
      <!-- Main content -->
      <div class="p-8">
        <!-- Step indicator -->
        <div class="flex mb-8">
          <div class="flex items-center text-center">
            <div [class]="!selectedCategory ? 'bg-indigo-600 text-white' : 'bg-indigo-100 text-indigo-600'" 
                 class="rounded-full h-10 w-10 flex items-center justify-center font-bold">
              1
            </div>
            <span [class]="!selectedCategory ? 'text-indigo-600 font-medium' : 'text-gray-500'" class="ml-3">Select Time Period</span>
          </div>
          <div class="flex-1 flex items-center">
            <div class="h-0.5 flex-1 mx-4" [class]="selectedCategory ? 'bg-indigo-600' : 'bg-gray-200'"></div>
          </div>
          <div class="flex items-center text-center">
            <div [class]="selectedCategory ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-500'" 
                 class="rounded-full h-10 w-10 flex items-center justify-center font-bold">
              2
            </div>
            <span [class]="selectedCategory ? 'text-indigo-600 font-medium' : 'text-gray-400'" class="ml-3">Configure & Generate</span>
          </div>
        </div>
  
        <!-- Select Time Period View (Step 1) -->
        <div *ngIf="!selectedCategory">
          <h2 class="text-xl font-semibold text-gray-800 mb-6">Select a Time Period</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div *ngFor="let category of reportCategories" 
                (click)="selectCategory(category)" 
                class="bg-white border border-gray-100 hover:border-indigo-300 rounded-lg p-6 cursor-pointer transition-all duration-300 hover:shadow-md flex flex-col items-center hover:scale-102 transform hover:-translate-y-1 text-center">
              <!-- Category icon based on type -->
              <div 
                [ngClass]="{
                  'bg-blue-100 text-blue-600': category.name.includes('Monthly'),
                  'bg-green-100 text-green-600': category.name.includes('Quarterly'),
                  'bg-purple-100 text-purple-600': category.name.includes('Yearly')
                }" 
                class="p-4 rounded-full mb-4">
                <svg *ngIf="category.name.includes('Monthly')" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <svg *ngIf="category.name.includes('Quarterly')" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <svg *ngIf="category.name.includes('Yearly')" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
              </div>
              
              <h4 class="font-medium text-gray-800 text-xl">{{ category.name }}</h4>
              <p class="text-gray-500 text-sm mt-2">
                Click to select
              </p>
            </div>
          </div>
        </div>
  
        <!-- Configure Report View (Step 2) -->
        <div *ngIf="selectedCategory">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold text-gray-800 flex items-center">
              <svg 
                [ngClass]="{
                  'text-blue-500': selectedCategory.name.includes('Monthly'),
                  'text-green-500': selectedCategory.name.includes('Quarterly'),
                  'text-purple-500': selectedCategory.name.includes('Yearly')
                }" 
                xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path *ngIf="selectedCategory.name.includes('Monthly')" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                <path *ngIf="selectedCategory.name.includes('Quarterly')" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                <path *ngIf="selectedCategory.name.includes('Yearly')" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
              {{ selectedCategory.name }}
            </h2>
            
            <button (click)="selectedCategory = null; selectedReport = null;" class="text-gray-500 hover:text-indigo-600 flex items-center transition-colors duration-200">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12" />
              </svg>
              Back to time periods
            </button>
          </div>
          
          <div class="bg-gray-50 rounded-xl p-6 mb-8">
            <h3 class="text-lg font-medium text-gray-800 mb-4 flex items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
              </svg>
              Configure Report
            </h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Year Filter -->
              <div *ngIf="shouldShowYearFilter()" class="group">
                <label for="yearFilter" class="block text-gray-700 mb-2 font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                  </svg>
                  Select Year
                </label>
                <div class="relative">
                  <select id="yearFilter" (change)="onFilterChange()" [(ngModel)]="filters.year" 
                    class="block w-full py-3 pl-4 pr-10 bg-white border border-gray-300 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-300">
                    <option *ngFor="let year of availableYears" [value]="year">{{ year }}</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </div>
                </div>
              </div>
              <!-- Month Filter (only for Monthly reports) -->
<div *ngIf="selectedCategory?.name.includes('Monthly')" class="group">
    <label for="monthFilter" class="block text-gray-700 mb-2 font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      Select Month
    </label>
    <select id="monthFilter" (change)="onFilterChange()" [(ngModel)]="filters.month" 
      class="block w-full py-3 pl-4 pr-10 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-300">
      <option *ngFor="let month of availableMonths" [value]="month.value">{{ month.label }}</option>
    </select>
  </div>
  
  <!-- Quarter Filter (only for Quarterly reports) -->
  <div *ngIf="selectedCategory?.name.includes('Quarterly')" class="group">
    <label for="quarterFilter" class="block text-gray-700 mb-2 font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      Select Quarter
    </label>
    <select id="quarterFilter" (change)="onFilterChange()" [(ngModel)]="filters.quarter" 
      class="block w-full py-3 pl-4 pr-10 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-300">
      <option *ngFor="let quarter of availableQuarters" [value]="quarter.value">{{ quarter.label }}</option>
    </select>
  </div>            <!-- Report Type Filter -->
              <div class="group">
                <label for="reportTypeFilter" class="block text-gray-700 mb-2 font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138" />
                  </svg>
                  Select Report Type
                </label>
                <div class="relative">
                  <select id="reportTypeFilter" [(ngModel)]="selectedReportType" (change)="updateSelectedReport()" 
                    class="block w-full py-3 pl-4 pr-10 bg-white border border-gray-300 rounded-lg appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition-all duration-300">
                    <option value="adherents">Adherents Statistics</option>
                    <option value="professionals">Healthcare Professionals Statistics</option>
                    <option value="movements">Movements Statistics</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="flex justify-center space-x-4">
            <button (click)="generateReport()" 
              [disabled]="reportExists"
              [ngClass]="reportExists ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:shadow-xl transform transition-all duration-300 hover:-translate-y-1'"
              class="text-white font-medium px-8 py-3 rounded-lg shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 flex items-center">
              <svg *ngIf="!isGenerating" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              <svg *ngIf="isGenerating" class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ isGenerating ? 'Generating Report...' : 'Generate Report' }}
            </button>
            
            <button (click)="getExistingReport()" 
              [disabled]="!reportExists "
              [ngClass]="!reportExists ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-green-500 to-teal-500 hover:shadow-xl transform transition-all duration-300 hover:-translate-y-1'"
              class="text-white font-medium px-8 py-3 rounded-lg shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 flex items-center">
              <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              <svg *ngIf="isLoading" class="animate-spin h-5 w-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              {{ isLoading ? 'Loading Report...' : 'Get Report' }}
            </button>
          </div>
          <!-- Results Section -->
          <div *ngIf="reportData" class="mt-10 animate-fade-in">
            <div class="border-b border-gray-200 pb-4 mb-6">
              <h3 class="text-xl font-semibold text-gray-800 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Report Results
              </h3>
            </div>
            
            <!-- Placeholder for chart/visualization -->
            <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-8 flex items-center justify-center">
              <div class="text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-indigo-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <h4 class="text-lg font-medium text-gray-800 mb-2">Report Generated Successfully!</h4>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
