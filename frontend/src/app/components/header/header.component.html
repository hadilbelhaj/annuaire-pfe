<div class="flex justify-between items-center px-8 py-5 bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-md">
  <div class="flex items-center space-x-2">
    <ng-container *ngIf="router.url === '/search-results'; else showTitle">
      <button (click)="goBack()" class="bg-white text-blue-700 px-4 py-1 rounded shadow text-sm hover:bg-blue-50 transition">
        ← Go Back
      </button>
    </ng-container>
    
    <ng-template #showTitle>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
      </svg>
      <div class="font-sans">
        <span class="text-2xl font-bold tracking-tight">Annuaire I-Santé</span>
        <p class="text-xs text-blue-100 font-light">Répertoire des Professionnels de Santé</p>
      </div>
    </ng-template>
    
  </div>

  <div class="flex space-x-6 items-center">
    <button (click)="makeSuggestion()" class="text-sm font-medium hover:text-blue-100 transition-colors flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Suggestion
    </button>

    <ng-container *ngIf="!(isLoggedIn$ | async); else loggedInTemplate">
      <button class="text-sm font-medium hover:text-blue-100 transition-colors flex items-center" (click)="navigateToAuth(false)">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        Connexion
      </button>

      <button class="bg-white text-blue-700 px-5 py-2 rounded-md font-medium hover:bg-blue-50 transition-colors shadow-sm flex items-center text-sm" (click)="navigateToAuth(true)">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        S'inscrire
      </button>
    </ng-container>
    <ng-container *ngIf=" (currentUser$ | async)?.roles?.includes('admin') || (currentUser$ | async)?.roles?.includes('super-admin') && (isLoggedIn$ | async)"
      ><button class="text-sm font-medium hover:text-blue-100 transition-colors flex items-center" (click)="navigateToAdmin()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m-3-3H9m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        Admin
      </button>
    </ng-container>

    <!-- Show Account and Logout when logged in -->
    <ng-template #loggedInTemplate>
      <button class="text-sm font-medium hover:text-blue-100 transition-colors flex items-center" (click)="navigateToProfile()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ (currentUser$ | async)?.email || 'Account' }}</span>
      </button>

      <button class="text-sm font-medium hover:text-blue-100 transition-colors flex items-center" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Déconnexion
      </button>
    </ng-template>
  </div>
</div>
