
<!-- Remove the outer container since it's now handled by the parent layout -->
<div class="relative">

  <!-- Error State -->
  <div *ngIf="error" class="text-center py-4">
    <div class="text-red-500 mb-4">{{ error }}</div>
    <button 
      (click)="retryLoad()" 
      class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors"
    >
      Retry
    </button>
  </div>

  <!-- Content -->
  <div>
    <!-- Total Results Count -->

    <div class="text-center text-gray-600 mb-4">

      Total Results: {{ totalItems || 0 }}
    </div>

    <!-- Professionals List -->

    <div *ngIf="professionals.length > 0" class="flex flex-col gap-4 mb-4">

      <app-professional-card 
        *ngFor="let pro of professionals" 
        [professional]="pro"
        class="w-full bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition-shadow"
      >
      </app-professional-card>
    </div>

    <!-- No Results State -->
    <div *ngIf="!professionals || professionals.length === 0" class="text-center py-8 text-gray-500">

      No professionals found.
    </div>

    <!-- Pagination Controls -->
    <div class="mt-4 flex justify-center items-center gap-4">
      <button 
        (click)="onPageChange(currentPage - 1)" 
        [disabled]="currentPage === 0"
        class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300 transition-colors">
        Previous
      </button>
      <span class="text-gray-600">
        Page {{ currentPage + 1 }} of {{ totalPages }}
      </span>
      <button 
        (click)="onPageChange(currentPage + 1)" 
        [disabled]="currentPage >= totalPages - 1"
        class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300 transition-colors">
        Next
      </button>
    </div>
  </div>
</div>
