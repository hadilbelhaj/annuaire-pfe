<div [ngClass]="{'flex flex-col': !isHorizontal, 'flex flex-row items-center space-x-4': isHorizontal}" 
     class="bg-white rounded-3xl shadow-lg overflow-hidden mb-4">
  
  <div [ngClass]="{'w-full border-b': !isHorizontal, 'w-1/4 border-r': isHorizontal}" 
       class="flex items-center px-6 py-4 bg-gray-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <input [(ngModel)]="selectedName" type="text" placeholder="Nom du professionnel de santé" 
           class="w-full px-4 py-2 text-lg focus:outline-none bg-gray-50">
  </div>
  
  <div [ngClass]="{'w-full border-b': !isHorizontal, 'w-1/4 border-r': isHorizontal}" 
       class="flex items-center px-6 py-4 bg-gray-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
    </svg>
    <select [(ngModel)]="selectedSpecialty" class="w-full px-4 py-2 text-lg focus:outline-none appearance-none cursor-pointer bg-gray-50">
      <option value="" disabled>Sélectionner une spécialité</option>
      <option *ngFor="let specialty of specialties" [value]="specialty">{{specialty}}</option>
    </select>
  </div>
  
  <div [ngClass]="{'w-full border-b': !isHorizontal, 'w-1/4 border-r': isHorizontal}" 
       class="flex items-center px-6 py-4 bg-gray-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    </svg>
    <select [(ngModel)]="selectedRegion" class="w-full px-4 py-2 text-lg focus:outline-none appearance-none cursor-pointer bg-gray-50">
      <option value="" disabled>Sélectionner une localisation</option>
      <option *ngFor="let region of regions" [value]="region">{{region}}</option>
    </select>
  </div>
  
  <div [ngClass]="{'w-full': !isHorizontal, 'w-1/4 flex items-center': isHorizontal}" 
       class="h-full">
    <button (click)="onSearch()"
          class="bg-[#1a365d] text-white px-8 py-4 text-lg hover:bg-blue-900 transition-colors flex items-center justify-center w-full h-full">
      Rechercher
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
</div>
